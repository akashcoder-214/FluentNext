$("tabs").innerHTML=Array.from({length:NP},(_,i)=>`<button class="tab" data-p="${i+1}" aria-pressed="${!q&&!onlyFav&&pg==i+1}">Page ${i+1}</button>`).join("");
const M={b:"English + हिन्दी",e:"Sirf English",h:"Sirf हिन्दी"};
$("opt").innerHTML=`<button class="chip" data-o="m">🔊 ${M[mode]}</button><button class="chip" data-o="hide" aria-pressed="${hide}">🙈 Hindi chhupao</button><button class="chip" data-o="hideE" aria-pressed="${hideE}">🙈 English chhupao</button><button class="chip" data-o="fav" aria-pressed="${onlyFav}">⭐ Favourites (${fav.size})</button><button class="chip" data-o="th">🌓 Theme</button>`;
const L=vis();
$("list").innerHTML=L.length?L.map(d=>`<div class="c${dn.has(d.n)?" d":""}" data-n="${d.n}"><span class="n">${d.n}</span><div class="t"><div class="e${hideE!=oE.has(d.n)?" x":""}">${d.e}</div><div class="h${hide!=oH.has(d.n)?" x":""}">${d.h}</div></div><div class="a"><button data-f="${d.n}" class="${fav.has(d.n)?"y":""}" aria-label="Favourite">${fav.has(d.n)?"⭐":"☆"}</button><button data-d="${d.n}" class="${dn.has(d.n)?"y":""}" aria-label="Yaad ho gaya">✅</button></div></div>`).join(""):`<div class="em">Kuch nahi mila. Doosra word try karo.</div>`;
$("pb").style.width=dn.size/D.length*100+"%";$("pt").textContent=`✅ ${dn.size} / ${D.length} yaad`}
document.addEventListener("click",e=>{const b=e.target.closest("button,.t");if(!b)return;
if(b.dataset.p){pg=+b.dataset.p;q="";$("q").value="";onlyFav=false;stop();draw()}
else if(b.dataset.o){const o=b.dataset.o;if(o=="m")mode=mode=="b"?"e":mode=="e"?"h":"b";
if(o=="hide"){hide=!hide;oH.clear()}if(o=="hideE"){hideE=!hideE;oE.clear()}if(o=="both"){const b=!(hide&&hideE);hide=hideE=b;oH.clear();oE.clear()}if(o=="fav"){onlyFav=!onlyFav;stop()}
if(o=="th"){const r=document.documentElement,d=getComputedStyle(r).colorScheme=="dark"||r.dataset.theme=="dark";r.dataset.theme=d?"light":"dark"}
draw()}
else if(b.dataset.x){const c=b.closest(".c"),n=+c.dataset.n,k=b.dataset.x,S=k=="e"?oE:oH;S.has(n)?S.delete(n):S.add(n);c.querySelector(k=="e"?".e":".h").classList.toggle("x")}
else if(b.dataset.f){const n=+b.dataset.f;fav.has(n)?fav.delete(n):fav.add(n);sv("bf",fav);draw()}
else if(b.dataset.d){const n=+b.dataset.d;dn.has(n)?dn.delete(n):dn.add(n);sv("bd",dn);draw()}
else if(b.classList.contains("t")){const c=b.closest(".c");tap(+c.dataset.n)}});
$("q").oninput=e=>{q=e.target.value;stop();draw()};
$("go").onclick=all;
$("sp").onclick=()=>{rate=rate==.9?.7:rate==.7?1.1:.9;$("sp").textContent=rate==.9?"1x":rate==.7?"0.7x":"1.2x"};
document.addEventListener("change",e=>{const s=e.target.dataset.vl;if(s){try{localStorage.setItem("v"+s,e.target.value)}catch(x){}speechSynthesis.cancel();say(s=="hi-IN"?"नमस्ते, यह मेरी आवाज़ है।":"Hello, this is my voice.",s)}});
$("sh").onclick=async()=>{try{await navigator.share({title:"FluentNext",text:"Sentence par tap karo, English aur Hindi dono sunai dete hain.",url:location.href})}catch(e){}};
draw();
</script></body></html>
